[package]
name = "subsafe-commander"
version = "0.1.0"
edition = "2024"
authors = ["bh2smith"]
description = "Control your Fleet of safes from the command line!"

[[bin]]
name = "subsafe-commander"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive", "env"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
duners = "0.0.2"
anyhow = "1.0"
dotenvy = "0.15"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
hex = "0.4"
alloy = { version = "1.0.42", default-features = false, features = [
    "providers",
    "signer-local",
    "network",
    "rpc-client",
    "reqwest",
    "dyn-abi",
    "sol-types",
    "contract",
] }

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

